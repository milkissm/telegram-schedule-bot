# Настройки инструментов разработки.
# Значения согласованы для всей команды: менять только через pull request.

[tool.ruff]
# Минимальная поддерживаемая версия Python (см. константы, К4).
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E — ошибки стиля (pycodestyle), F — ошибки кода (pyflakes):
# неиспользуемые импорты и переменные, обращение к несуществующим именам.
select = ["E", "F"]

[tool.ruff.format]
# Форматтер приводит код к единому виду: двойные кавычки, отступы, пробелы.
quote-style = "double"
